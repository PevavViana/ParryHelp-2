              <path class="shape-line" d="M262 450l14 14M276 450l-14 14" />
              <path class="shape-spark" d="M210 640l5 15 15 5-15 5-5 15-5-15-15-5 15-5Z" />
              <circle class="shape-ring" cx="58" cy="560" r="9" />
            </g>

            <g class="decoration-b">
