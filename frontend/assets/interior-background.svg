<svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1440 800"
            preserveAspectRatio="xMidYMid slice"
            focusable="false"
          >
            <style>
  .texture-dots { opacity: .06; }
  .shape-fill { fill: #1d44ff; opacity: .14; }
  .shape-soft { fill: #c7d4ff; opacity: .04; }
  .shape-line, .shape-ring { fill: none; stroke: #c7d4ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .16; }
  .shape-spark { fill: #c7d4ff; opacity: .14; }
</style>
<defs>
              <radialGradient id="landing-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#2d55ff" stop-opacity="0.1" />
                <stop offset="1" stop-color="#2d55ff" stop-opacity="0" />
              </radialGradient>
              <pattern
                id="landing-dots"
                width="32"
                height="32"
                patternUnits="userSpaceOnUse"
              >
                <circle cx="1.5" cy="1.5" r="1.1" fill="#c9d6ff" />
              </pattern>
              <radialGradient id="landing-fade" cx="50%" cy="50%" r="62%">
                <stop offset="0.35" stop-color="#fff" stop-opacity="0" />
                <stop offset="1" stop-color="#fff" stop-opacity="1" />
              </radialGradient>
              <mask id="landing-dots-mask">
                <rect width="1440" height="800" fill="url(#landing-fade)" />
              </mask>
            </defs>

            <rect
              class="texture-dots"
              width="1440"
              height="800"
              fill="url(#landing-dots)"
              mask="url(#landing-dots-mask)"
            />
            <ellipse
              cx="720"
              cy="420"
              rx="620"
              ry="360"
              fill="url(#landing-glow)"
            />

            <g class="decoration-a">
